name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake nasm libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libasound2-dev libxkbcommon-dev libwayland-dev openssh-client fonts-dejavu-core fonts-liberation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release --tests --locked -- -D warnings
      - run: cargo test --release --locked

  windows:
    name: Windows (cross-built clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release --target x86_64-pc-windows-gnu --locked -- -D warnings
