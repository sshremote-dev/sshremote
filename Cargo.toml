[package]
name = "sshremote"
version = "0.1.0"
edition = "2024"
description = "Remote control over SSH, in a terminal or a window"
license = "MIT"

[dependencies]
alacritty_terminal = { version = "0.25", default-features = false }
arboard = { version = "3", default-features = false }
chacha20poly1305 = "0.10"
cpal = "0.18.2"
crossterm = "0.29.0"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "system_fonts", "wayland", "x11", "clipboard"] }
getrandom = "0.2"
hkdf = "0.12"
openh264 = "0.9"
opus = "0.3"
png = "0.17"
serde_json = "1"
sha2 = "0.10"
spake2 = "0.4"
zstd = "0.14.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.4"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_StationsAndDesktops", "Win32_System_Console", "Win32_System_IO", "Win32_Security_Authorization", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Services", "Win32_System_Time"] }

[profile.release]
opt-level = 3
lto = "thin"
