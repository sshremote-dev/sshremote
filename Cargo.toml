[package]
name = "desk"
version = "0.1.0"
edition = "2024"
description = "Remote desktop over SSH, viewed in a terminal or a window"
license = "MIT"

[dependencies]
crossterm = "0.29.0"
minifb = "0.29"
openh264 = "0.9"
zstd = "0.14.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.4"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_StationsAndDesktops", "Win32_System_Console", "Win32_System_IO", "Win32_Security_Authorization", "Win32_System_Diagnostics_Debug"] }

[profile.release]
opt-level = 3
lto = "thin"
