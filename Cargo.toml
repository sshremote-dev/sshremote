[package]
name = "sshremote"
version = "0.25.32"
edition = "2024"
description = "A workspace for many servers and projects: terminals, Markdown, screens and files over SSH"
license = "MIT"
repository = "https://github.com/sshremote-dev/sshremote"
homepage = "https://sshremote.dev"

[dependencies]
alacritty_terminal = { optional = true, version = "0.25", default-features = false }
arboard = { optional = true, version = "3", default-features = false, features = ["image-data"] }
chacha20poly1305 = "0.10"
cpal = { optional = true, version = "0.18.2" }
crossterm = { optional = true, version = "0.29.0" }
eframe = { optional = true, version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "system_fonts", "wayland", "x11", "clipboard"] }
qrcode = { optional = true, version = "0.15", default-features = false, features = ["std"] }
getrandom = "0.2"
hkdf = { optional = true, version = "0.12" }
curve25519-dalek = { optional = true, version = "4" }
openh264 = { optional = true, version = "0.9" }
opus = { optional = true, version = "0.4" }
png = { optional = true, version = "0.17" }
# Pictures behind the terminal panes, as people have them (JPEG, PNG, WebP, BMP, GIF).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
# Lottie animations (JSON and .lottie) for the logo and the background, drawn on the CPU.
rasterlottie = { optional = true, version = "0.3", default-features = false, features = ["images", "text", "dotlottie"] }
# .lottie packages opened here, so their animation can be read as the format allows (in the tree already).
zip = { version = "9", default-features = false, features = ["deflate"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
unicode-width = { optional = true, version = "0.2" }
spake2 = { optional = true, version = "0.4" }
zstd = { optional = true, version = "0.14.3" }
wasmi = { version = "2.0.3", default-features = false, features = ["std", "validate", "auto-dispatch"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# OpenGL as well, for a Mac whose GPU has no Metal (a virtual machine, the oldest Macs).
eframe = { optional = true, version = "0.37", default-features = false, features = ["glow"] }
# A window that opens without taking the keyboard from the program in front (already in the build
# through eframe).
winit = { optional = true, version = "0.30", default-features = false }
# The screen through ScreenCaptureKit and input through Core Graphics events (the objc2 family
# winit and the clipboard bring on macOS already).
objc2 = { optional = true, version = "0.6" }
objc2-foundation = { optional = true, version = "0.3" }
objc2-screen-capture-kit = { optional = true, version = "0.3" }
objc2-core-media = { optional = true, version = "0.3" }
objc2-core-video = { optional = true, version = "0.3" }
objc2-core-graphics = { optional = true, version = "0.3" }
objc2-core-foundation = { optional = true, version = "0.3" }
block2 = { optional = true, version = "0.6" }
dispatch2 = { optional = true, version = "0.3" }

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = { optional = true, version = "0.25.4" }
gstreamer-app = { optional = true, version = "0.25.2" }
gstreamer-video = { optional = true, version = "0.25.4" }
# Files dropped on the windows (winit takes none under Wayland), on the windows' own connection;
# where they were let go under X11; the system's shortcuts held back while a remote screen has
# the keys. All already in the build through winit.
wayland-client = { optional = true, version = "0.31" }
wayland-backend = { optional = true, version = "0.3", features = ["client_system"] }
wayland-protocols = { optional = true, version = "0.32", features = ["client", "unstable"] }
x11-dl = { optional = true, version = "2.21" }
raw-window-handle = { optional = true, version = "0.6" }
# Input for wlroots desktops (Sway, Hyprland), whose portal takes none.
wayland-protocols-wlr = { optional = true, version = "0.3", features = ["client"] }
wayland-protocols-misc = { optional = true, version = "0.3", features = ["client"] }
zbus = { optional = true, version = "6.5", default-features = false, features = ["proxy", "service", "default-rt"] }
# The next message of a zbus stream (already in the build through GStreamer).
futures-util = { optional = true, version = "0.3", default-features = false }
# X11 desktops' screens and input (already in the build through winit).
x11rb = { optional = true, version = "0.13", default-features = false, features = ["allow-unsafe-code", "shm", "damage", "xfixes", "xtest", "randr"] }

[target."cfg(windows)".dependencies]
uiautomation = { optional = true, version = "0.25" }
# Already in the tree through uiautomation; its COM interfaces drive Desktop Duplication.
windows = { optional = true, version = "0.62", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_System_Com"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Media", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_StationsAndDesktops", "Win32_System_Console", "Win32_System_IO", "Win32_Security_Authorization", "Win32_System_Diagnostics_Debug", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Services", "Win32_System_Time", "Win32_UI_Shell", "Win32_Security_Credentials", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_System_Environment", "Win32_Networking_WinSock"] }

[features]
default = ["gui", "remote", "web", "mcp"]
# Remote screens, files, chat and sound, with the agent that serves them on the host.
remote = ["dep:arboard", "dep:crossterm", "dep:png", "dep:unicode-width", "dep:zstd", "dep:cpal", "dep:hkdf", "dep:curve25519-dalek", "dep:openh264", "dep:opus", "dep:spake2", "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:zbus", "dep:futures-util", "dep:x11rb", "dep:wayland-client", "dep:wayland-protocols-wlr", "dep:wayland-protocols-misc", "dep:uiautomation", "dep:windows", "dep:objc2", "dep:objc2-foundation", "dep:objc2-screen-capture-kit", "dep:objc2-core-media", "dep:objc2-core-video", "dep:objc2-core-graphics", "dep:objc2-core-foundation", "dep:block2", "dep:dispatch2"]
# The windows: workspace, viewer, tools. Without it, a small program for the command line and services.
gui = ["dep:alacritty_terminal", "dep:eframe", "dep:png", "dep:unicode-width", "dep:qrcode", "dep:rasterlottie", "dep:wayland-client", "dep:wayland-backend", "dep:wayland-protocols", "dep:x11-dl", "dep:raw-window-handle", "dep:winit"]
# The browser gateway and the MCP server; without them the registry's extensions bring them.
web = ["remote"]
mcp = ["remote"]
# The built-in synthetic desktop in the open window, for trying the viewer during development.
test-desktop = []
# Input and screenshots of the real window from a command file (SSHREMOTE_DRIVE), for testing builds by hand.
drive = ["gui"]

[profile.release]
opt-level = 3
lto = "thin"

# What is shipped: `cargo build --profile dist`, the whole program optimised as one.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
# Function names stay for the crash notes; the rest of the debug data goes.
strip = "debuginfo"

[dev-dependencies]
wat = "1"
